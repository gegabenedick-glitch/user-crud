
name: Deploy Ionic App Locally

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ionic-crud:latest .

      - name: Remove previous container
        run: docker rm -f ionic-crud
        continue-on-error: true

      - name: Start updated container
        run: docker run -d --name ionic-crud --restart unless-stopped -p 8101:8100 ionic-crud:latest\

      - name: Verify app
        shell: powershell
        run: |
          $success = $false

          for ($j = 1; $j -le 15; $j++) {
              try {
                  Invoke-WebRequest http://localhost:8101/ -UseBasicParsing -TimeoutSec 5 | Out-Null
                  $success = $true
                  break
              }
              catch {
                  Start-Sleep -Seconds 2
              }
          }

          if (-not $success) {
              docker logs ionic-crud
              exit 1
          }
